version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: comp_equity_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: compensation_equity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compensation_equity"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comp_equity_api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/compensation_equity
      REPORTING_CURRENCY: USD
      RANDOM_SEED: 20261022
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comp_equity_dashboard
    restart: always
    environment:
      API_BASE_URL: http://backend:8000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/compensation_equity
    ports:
      - "8501:8501"
    command: streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
